└── package.json                        # Root package.json for scripts

## 3. Key Changes & Benefits

### Separation of Concerns
- **Clear user-type boundaries**: Each user type has its own folder with tailored features
- **Shared components**: Common functionality remains in `shared/` folder
- **Persona-aware routing**: Different navigation and features per user type

### Enhanced User Experience
- **Tailored dashboards**: Each user type gets a custom dashboard with relevant widgets
- **Relevant features only**: Students don't see enterprise features, entrepreneurs don't see college planning
- **Personalized branding**: Each user type can have its own color scheme and imagery

### Maintainable Architecture
- **Modular structure**: Easy to add features for specific user types without affecting others
- **Clear boundaries**: Developers know exactly where to add new features
- **Reusable components**: Shared components prevent code duplication

---

## 4. Implementation Strategy

### Phase 1: Setup Structure
1. Create new folder structure
2. Move shared components to `shared/` folder
3. Create persona context and configuration files
4. Update routing to be persona-aware

### Phase 2: Create Dashboards
1. Build 4 separate dashboard components
2. Create persona-specific sidebar navigation
3. Implement user-type detection and routing
4. Add themed styling per user type

### Phase 3: Feature Migration
1. Move existing features to appropriate user folders
2. Customize features for each user type
3. Remove irrelevant features from each persona
4. Add user-type specific enhancements

### Phase 4: Backend Updates
1. Create persona-specific API endpoints
2. Add user-type aware data filtering
3. Implement role-based permissions
4. Update ML analysis for different contexts

---

## 5. Configuration Files

Each user type will have its own configuration defining:
- **Available features**: Which components/pages are accessible
- **Navigation structure**: Sidebar menu items and routes  
- **Theme colors**: Primary, secondary, accent colors
- **Dashboard widgets**: Which metrics and quick actions to show
- **Onboarding steps**: Tailored questions for each user type

This structure ensures each user gets a focused, relevant experience while maintaining code organization and reusability.